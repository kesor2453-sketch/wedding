<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ធៀបការ</title>
<meta name="description" content="សូមគោរពអញ្ជើញចូលរួមពិធីអាពាហ៍ពិពាហ៍">
<meta property="og:title" content="សិរីមង្គលអាពាហ៍ពិពាហ៍">
<meta property="og:description" content="សូមគោរពអញ្ជើញចូលរួមពិធីអាពាហ៍ពិពាហ៍">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Moul&family=Battambang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: a phone-shaped silk "film" stage that plays the invitation page by page; a stacked list view for reading and editing. Deliberate single theme (crimson silk + gold). */
:root{
  color-scheme: dark;
  --silk:#5c0c1c;
  --silk-deep:#3f0612;
  --gold:#d9b25f;
  --gold-soft:#f0d79a;
  --ivory:#fbf3e2;
  --ink-soft:#e9d3bf;
  --edit:#7ec8b8;
  --f-display:"Moul", "Khmer OS Muol Light", serif;
  --f-body:"Battambang", "Khmer OS", system-ui, sans-serif;
  --f-latin:"Cormorant Garamond", Georgia, serif;
  --ts:1;
  --shade:63,6,18;
  --glow:#7a1427;
  --on-gold:#3f0612;
}
/* owner-selectable themes */
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--silk-deep);
  background-image:radial-gradient(ellipse at 50% 0%, var(--glow) 0%, transparent 60%),repeating-linear-gradient(45deg, rgba(217,178,95,.04) 0 2px, transparent 2px 14px);
  color:var(--ivory); font-family:var(--f-body); line-height:1.9;
  padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body.has-bar{padding-bottom:96px}
h1,h2,h3,.moul{font-family:var(--f-display); font-weight:400; color:var(--gold-soft); text-wrap:balance; margin:0}
h2{font-size:calc(20px * var(--ts))}
button{font-family:inherit}

/* shared page look */
.page{position:relative; background:var(--silk); border:1px solid var(--gold); border-radius:4px; text-align:center}
.page:not(.photo)::before{content:""; position:absolute; inset:11px; border:1px solid rgba(217,178,95,.55); pointer-events:none; z-index:2}
.page:not(.photo)::after{content:""; position:absolute; inset:16px; border:1px solid rgba(217,178,95,.22); pointer-events:none; z-index:2}
.inner{display:flex; flex-direction:column; gap:22px; padding:64px 34px 60px; margin:auto 0; width:100%}
.corner{position:absolute; width:68px; height:68px; color:var(--gold); pointer-events:none; z-index:3}
.corner.c-tl{top:4px; left:4px}.corner.c-tr{top:4px; right:4px; transform:scaleX(-1)}
.corner.c-bl{bottom:4px; left:4px; transform:scaleY(-1)}.corner.c-br{bottom:4px; right:4px; transform:scale(-1,-1)}
.lotus{width:64px; height:auto; margin:0 auto; color:var(--gold)}
.crest{width:min(220px, 70%); height:auto; margin:0 auto; color:var(--gold); display:block; overflow:visible}
.flipv{transform:scaleY(-1)}
.rule{width:min(260px, 86%); height:auto; color:var(--gold); display:block; margin:0 auto; overflow:visible}
.vh{display:flex; flex-direction:column; align-items:center; gap:4px}
.vh .hd{width:110px; height:auto; color:var(--gold); overflow:visible}
.vh .hd.flip{transform:scaleY(-1)}
.vh h2{letter-spacing:.03em}
.cart{position:relative; margin:4px 14px; padding:10px 18px; border:1px solid var(--gold); outline:1px solid rgba(217,178,95,.45); outline-offset:4px; background:rgba(var(--shade),.25)}
.has-cover .cart{background:rgba(var(--shade),.55)}
.cart .ear{position:absolute; top:50%; left:-31px; width:24px; height:40px; transform:translateY(-50%); color:var(--gold)}
.cart .ear.r{left:auto; right:-31px; transform:translateY(-50%) scaleX(-1)}
.divider{display:flex; align-items:center; justify-content:center; color:var(--gold)}
.eyebrow{font-family:var(--f-display); font-size:calc(15px * var(--ts)); color:var(--gold)}
.names{display:flex; flex-direction:column; align-items:center; gap:2px}
.names h1{font-size:calc(clamp(26px, 8vw, 36px) * var(--ts)); line-height:1.7}
.amp{font-family:var(--f-latin); font-style:italic; font-size:30px; color:var(--gold); line-height:1}
.latin{font-family:var(--f-latin); font-size:20px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase}
.date-big{font-family:var(--f-latin); font-size:22px; color:var(--gold-soft); letter-spacing:.2em; font-variant-numeric:tabular-nums}
.cover-photo{position:absolute; inset:0; overflow:hidden; border-radius:4px}
.cover-photo img{width:100%; height:100%; object-fit:cover; display:block}
.cover-photo::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(var(--shade),.1) 30%, rgba(var(--shade),.92) 78%)}
.has-cover .inner{position:relative; z-index:1; margin-top:auto; padding-top:40vh}
.parents{display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:15px}
.parents>div{min-width:0}
.side{font-family:var(--f-display); font-size:13px; color:var(--gold); display:block; margin-bottom:4px}
.parents p{margin:0}
.invite-text{font-size:16px; color:var(--ink-soft); white-space:pre-line}
.couple{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.couple>div{min-width:0; padding:12px 8px; border-top:1px solid rgba(217,178,95,.4); border-bottom:1px solid rgba(217,178,95,.4)}
.role{font-size:14px; color:var(--gold)}
.couple .moul{font-size:calc(19px * var(--ts)); line-height:1.8; display:block}
.when{display:flex; flex-direction:column; gap:4px; font-size:16px}
.when .moul{font-size:calc(18px * var(--ts))}
.lunar{font-size:14px; color:var(--ink-soft)}
.countdown{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:340px; margin:0 auto; width:100%}
.countdown div{border:1px solid rgba(217,178,95,.5); padding:8px 4px 4px; border-radius:3px}
.countdown b{display:block; font-family:var(--f-latin); font-size:26px; color:var(--gold-soft); font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.countdown small{font-size:12px; color:var(--ink-soft)}
.session{text-align:left}
.session h3{font-size:16px; color:var(--gold); text-align:center; margin-bottom:6px}
.session ol{list-style:none; margin:0; padding:0}
.session li{display:grid; grid-template-columns:62px 1fr auto; gap:12px; align-items:start; padding:8px 0; border-bottom:1px dashed rgba(217,178,95,.28); font-size:15px}
.session li:last-child{border-bottom:0}
.session time{font-family:var(--f-latin); font-size:18px; color:var(--gold-soft); font-variant-numeric:tabular-nums; font-weight:600}
.session li span{min-width:0}
.gallery{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.gallery figure{margin:0; position:relative; min-width:0}
.gallery figure:first-child{grid-column:1/-1}
.gallery img{width:100%; aspect-ratio:1; max-width:100%; object-fit:cover; display:block; border-radius:3px; cursor:zoom-in; border:1px solid rgba(217,178,95,.35)}
.gallery figure:first-child img{aspect-ratio:4/3}
video{width:100%; max-width:100%; max-height:60vh; border:1px solid var(--gold); border-radius:4px; background:#000}
.venue p,.gift p,.closing p{margin:0; font-size:15px; color:var(--ink-soft); white-space:pre-line}
.qr{width:200px; max-width:100%; background:#fff; padding:10px; border-radius:6px; margin:0 auto; display:block}
.actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.btn{display:inline-flex; align-items:center; gap:8px; font-size:15px; text-decoration:none; padding:10px 18px; border-radius:999px; border:1px solid var(--gold); color:var(--gold-soft); background:transparent; cursor:pointer}
.btn.solid{background:var(--gold); color:var(--on-gold); font-weight:700}
.btn:hover{background:var(--gold-soft); color:var(--silk-deep)}
.btn svg{width:16px; height:16px}
:focus-visible{outline:2px solid var(--gold-soft); outline-offset:3px}

/* photo page */
.page.photo{background:#1c0308; overflow:hidden}
.photo .frame{position:absolute; inset:0; overflow:hidden; border-radius:4px}
.photo .frame img{width:100%; height:100%; object-fit:contain; display:block; transform-origin:center}
.photo .frame .bg{position:absolute; inset:-20px; width:calc(100% + 40px); height:calc(100% + 40px); object-fit:cover; filter:blur(18px) brightness(.5)}
.photo .frame img.fg{position:relative}
.photo .cap{position:absolute; left:0; right:0; bottom:0; z-index:1; padding:40px 16px 18px; background:linear-gradient(transparent, rgba(28,3,8,.85)); font-family:var(--f-latin); font-size:20px; letter-spacing:.14em; color:var(--gold-soft); text-transform:uppercase}

/* player */
.player{position:relative; max-width:480px; margin:0 auto; height:calc(100vh - 32px); height:calc(100dvh - 32px); max-height:900px; min-height:520px; display:flex; flex-direction:column; gap:10px}
body.has-bar .player{height:calc(100vh - 112px); height:calc(100dvh - 112px)}
.progress{display:flex; gap:4px; padding:0 2px}
.progress button{flex:1; height:14px; padding:5px 0; background:none; border:0; cursor:pointer}
.progress i{display:block; height:3px; border-radius:2px; background:rgba(240,215,154,.25); overflow:hidden}
.progress i b{display:block; height:100%; width:0; background:var(--gold-soft)}
.slides{position:relative; flex:1; min-height:0; touch-action:pan-y pinch-zoom}
.slide{position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .7s ease, visibility 0s linear .7s, transform .7s ease; transform:scale(1.02)}
.slide.on{opacity:1; visibility:visible; transform:none; transition:opacity .7s ease, visibility 0s, transform .7s ease}
.slide .page{height:100%; overflow:auto; display:flex; flex-direction:column; overscroll-behavior:contain}
.slide .inner{margin:auto 0}
.slide.on .inner>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.slide.on .inner>*:nth-child(2){animation-delay:.15s}.slide.on .inner>*:nth-child(3){animation-delay:.3s}
.slide.on .inner>*:nth-child(4){animation-delay:.45s}.slide.on .inner>*:nth-child(5){animation-delay:.6s}
.slide.on .inner>*:nth-child(6){animation-delay:.75s}.slide.on .inner>*:nth-child(n+7){animation-delay:.9s}
@keyframes rise{from{opacity:0; transform:translateY(14px)}}
/* text entrance styles (owner picks one) */
body[data-tfx=blur] .slide.on .inner>*{animation-name:blurIn; animation-duration:1s}
body[data-tfx=bounce] .slide.on .inner>*{animation-name:dropIn; animation-duration:.9s}
body[data-tfx=zoom] .slide.on .inner>*{animation-name:zoomIn; animation-duration:.9s}
body[data-tfx=none] .slide.on .inner>*{animation:none}
@keyframes blurIn{from{opacity:0; filter:blur(12px); transform:scale(1.08)}}
@keyframes dropIn{0%{opacity:0; transform:translateY(-46px)} 60%{opacity:1; transform:translateY(8px)} 80%{transform:translateY(-3px)} 100%{transform:none}}
@keyframes zoomIn{0%{opacity:0; transform:scale(.4)} 70%{opacity:1; transform:scale(1.06)} 100%{transform:none}}
/* letter by letter: each Khmer cluster springs up in turn */
.ch{display:inline-block; white-space:pre}
.slide.on .ch,.start .ch,.seal .ch{animation:chIn .7s cubic-bezier(.2,.75,.25,1.25) both; animation-delay:calc(var(--i) * 45ms + var(--d, 150ms))}
@keyframes chIn{0%{opacity:0; transform:translateY(.7em) scale(.5) rotate(-10deg); filter:blur(4px)} 100%{opacity:1; transform:none; filter:none}}
.st-title .ch{--d:500ms}
/* split headings carry their colour on each letter (a clipped gradient cannot reach animated letters) */
.st-title[data-split]{background:none; color:#f5dc9c; -webkit-background-clip:border-box; background-clip:border-box}
/* light running across split headings: each letter glows in turn */
body[data-shimmer="1"] .slide.on .ch, body[data-shimmer="1"] .start .ch, body[data-shimmer="1"] .seal .ch{animation:chIn .7s cubic-bezier(.2,.75,.25,1.25) both, chGlow 4s ease-in-out infinite;
  animation-delay:calc(var(--i) * 45ms + var(--d, 150ms)), calc(var(--i) * 70ms + var(--d, 150ms) + 1.6s)}
@keyframes chGlow{0%,22%,100%{text-shadow:none; filter:none} 8%{text-shadow:0 0 6px #fff6dc, 0 0 16px rgba(255,226,150,.95); filter:brightness(1.5)}}.st-invite .ch{--d:1100ms}.banner .ch{--d:1500ms}
/* a band of light that runs across the headings */
body[data-shimmer="1"] .names h1:not([data-split]), body[data-shimmer="1"] .slide h2:not([data-split]), body[data-shimmer="1"] .seal-n:not([data-split]), body[data-shimmer="1"] .couple .moul:not([data-split]){
  background:linear-gradient(110deg, var(--gold-soft) 0%, var(--gold-soft) 42%, #fffaf0 50%, var(--gold-soft) 58%, var(--gold-soft) 100%); background-size:260% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 3.6s ease-in-out infinite}
body[data-shimmer="1"] .st-title:not([data-split]){background:linear-gradient(110deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%) 0 0 / 260% 100%, linear-gradient(180deg, #fff6d8 0%, #f0d79a 35%, #c9993f 62%, #f7e3a8 80%, #b88a35 100%); -webkit-background-clip:text; background-clip:text; animation:shine2 3.6s ease-in-out infinite 1.2s}
@keyframes shine{0%{background-position:100% 0} 60%,100%{background-position:0 0}}
@keyframes shine2{0%{background-position:100% 0, 0 0} 60%,100%{background-position:0 0, 0 0}}
.slide.on .kb{animation:kb var(--dur,6s) linear both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
.paused .slide .kb{animation-play-state:paused!important}
.progress,.ctl{display:none!important}
.player{gap:0}
.slides img{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none}
.slides{-webkit-user-select:none; user-select:none}
.flash{position:absolute; inset:0; margin:auto; width:72px; height:72px; border-radius:50%; background:rgba(28,3,8,.55); color:var(--gold-soft); display:grid; place-items:center; z-index:4; pointer-events:none; animation:flash .7s ease forwards}
.flash svg{width:30px; height:30px}
@keyframes flash{from{opacity:1; transform:scale(.85)}to{opacity:0; transform:scale(1.15)}}
.ctl{display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap}
.ic{width:42px; height:42px; border-radius:999px; border:1px solid rgba(217,178,95,.55); background:rgba(63,6,18,.6); color:var(--gold-soft); display:inline-grid; place-items:center; cursor:pointer; padding:0}
.ic:hover{background:var(--gold); color:var(--silk-deep)}
.ic.big{width:50px; height:50px; background:var(--gold); color:var(--silk-deep)}
.ic svg{width:20px; height:20px}
.ic[disabled]{opacity:.35; cursor:default}
.sep{width:1px; height:24px; background:rgba(217,178,95,.35); margin:0 4px}
.count{font-family:var(--f-latin); font-size:16px; color:var(--ink-soft); min-width:48px; text-align:center; font-variant-numeric:tabular-nums}
.zlabel{font-family:var(--f-latin); font-size:15px; color:var(--ink-soft); min-width:44px; text-align:center; font-variant-numeric:tabular-nums}
/* opening screen: full photo, gold title, guest name on a banner, play button */
.start{position:absolute; inset:0; z-index:6; overflow:hidden; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center; cursor:pointer; background:var(--silk); transition:opacity .8s ease, transform .8s ease}
.start.out{opacity:0; transform:scale(1.04); pointer-events:none}
.start .bgimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.start::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(var(--shade),.55) 0%, rgba(var(--shade),0) 30%, rgba(var(--shade),0) 52%, rgba(var(--shade),.82) 82%, rgba(var(--shade),.92) 100%); pointer-events:none}
.start > *:not(.bgimg){position:relative; z-index:2}
.start .corner{position:absolute; z-index:3; width:82px; height:82px}
.st-top{padding:9% 20px 0; display:flex; flex-direction:column; align-items:center; gap:2px}
.st-title{font-family:var(--f-display); font-size:calc(clamp(30px, 10vw, 44px) * var(--ts)); line-height:1.55; white-space:pre-line; margin:0;
  background:linear-gradient(180deg, #fff6d8 0%, #f0d79a 35%, #c9993f 62%, #f7e3a8 80%, #b88a35 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(240,215,154,.35))}
.st-top .crest{width:180px; color:var(--gold-soft); filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.st-bot{width:100%; padding:0 18px 7%; display:flex; flex-direction:column; align-items:center; gap:12px}
.st-invite{font-family:var(--f-display); font-size:calc(clamp(20px, 6.4vw, 27px) * var(--ts)); line-height:1.6; color:var(--gold-soft); text-shadow:0 2px 4px rgba(0,0,0,.6)}
.banner{position:relative; width:min(100%, 330px); margin:0 34px; padding:8px 16px; background:linear-gradient(180deg, #fffdf6, #f3e6c4); border:2px solid #d9b25f; outline:1px solid #d9b25f; outline-offset:3px; border-radius:3px; box-shadow:0 8px 24px -10px rgba(0,0,0,.7)}
.banner b{display:block; font-family:var(--f-display); font-weight:400; font-size:calc(clamp(16px, 5vw, 21px) * var(--ts)); line-height:1.7; color:#5c0c1c; overflow-wrap:anywhere}
.banner .ear{position:absolute; top:50%; left:-33px; width:26px; height:44px; transform:translateY(-50%); color:#e3c06d}
.banner .ear.r{left:auto; right:-33px; transform:translateY(-50%) scaleX(-1)}
.st-play{width:58px; height:58px; border-radius:50%; border:2px solid #d9b25f; background:#fffaf0; color:#5c0c1c; display:grid; place-items:center; cursor:pointer; padding:0; box-shadow:0 0 0 5px rgba(240,215,154,.25), 0 8px 20px -6px rgba(0,0,0,.7)}
.st-play svg{width:24px; height:24px; margin-left:3px}
.st-hint{font-size:13px; color:var(--ink-soft); text-shadow:0 1px 3px rgba(0,0,0,.7)}
@media (prefers-reduced-motion:no-preference){
  .st-play{animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 11px rgba(240,215,154,.12), 0 8px 20px -6px rgba(0,0,0,.7)}}
  .start .bgimg{animation:kb 14s ease-out both}
  .st-top,.st-bot{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}.st-bot{animation-delay:.35s}
}

/* timeline programme */
.tl{position:relative; display:grid; grid-template-columns:1fr 1fr; margin-top:6px}
.tl .vine{position:absolute; left:50%; top:0; width:24px; height:100%; transform:translateX(-50%); color:var(--gold)}
.tl-item{display:flex; flex-direction:column; align-items:center; gap:0; padding:2px 16px 12px; font-size:14px; line-height:1.6; min-width:0; text-align:center}
.tl-item.l{grid-column:1}.tl-item.r{grid-column:2}
.tl-item svg{width:34px; height:34px; color:var(--gold); margin-bottom:2px}
.tl-item time{font-family:var(--f-latin); font-size:17px; color:var(--gold-soft); font-weight:600; font-variant-numeric:tabular-nums}
.tl-item span{min-width:0}
.script{font-family:var(--f-latin); font-style:italic; font-size:28px; color:var(--gold-soft); line-height:1.2}
.collage{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.collage img{width:100%; max-width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:3px; display:block; border:1px solid rgba(217,178,95,.35)}
.collage img:first-child{grid-column:1/-1; aspect-ratio:4/3}
.has-cover .countdown div{background:rgba(var(--shade),.5)}
/* quick buttons under the film */
.player:not(.go) .qnav{visibility:hidden}
.qnav{display:flex; gap:8px; justify-content:center; padding-top:10px}
.qnav button{flex:1; max-width:92px; height:50px; border-radius:12px; border:1px solid rgba(217,178,95,.5); background:rgba(var(--shade),.7); color:var(--gold-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; cursor:pointer; font-size:11px; line-height:1.3}
.qnav button svg{width:19px; height:19px}
.qnav button.on{background:var(--gold); color:var(--on-gold)}
.sparks{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3}
.backdrop{position:fixed; inset:-40px; z-index:-1; background-size:cover; background-position:center; filter:blur(22px) brightness(.45)}
/* list view */
.list{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
.list .page{display:flex; flex-direction:column}
.list .page.photo{display:none}
.list .page.has-cover{min-height:560px}
.list .page.has-cover .inner{padding-top:300px}
.backbar{display:flex; justify-content:center}

/* owner editing */
.editing [data-k]{outline:1px dashed var(--edit); outline-offset:3px; border-radius:2px; cursor:text}
.editing [data-k]:focus{outline-style:solid; background:rgba(126,200,184,.08)}

    }).catch(function(e){
      var st = e && e.status;
      msg.textContent = st === 401 ? "Token មិនត្រឹមត្រូវ ឬផុតកំណត់" : (e && e.contents) ? "Token មិនទាន់មានសិទ្ធិ Contents — នៅ GitHub កែ token៖ Repository access → " + repo + " និង Permissions → Contents → Read and write" : (st === 403 || st === 404) ? "Token នេះគ្មានសិទ្ធិសរសេរលើ repo នេះទេ" : "ពិនិត្យមិនបាន សូមពិនិត្យអ៊ីនធឺណិត";
      btn.disabled = false;
    });
  }
  // secret door for the owner: tap the date on the cover 5 times quickly (or open the link with #edit)
  var taps = 0, tapTimer = null;
  app.addEventListener("click", function(e){
    if (!e.target.closest(".date-big,.lotus") || editing) return;
    taps++; clearTimeout(tapTimer); tapTimer = setTimeout(function(){ taps = 0; }, 1500);
    if (taps >= 5) { taps = 0; openLogin(); }
  }, true);
  window.addEventListener("hashchange", function(){ if (location.hash === "#edit") openLogin(); });

  // ---- start: load data.json (the owner's saved content), then show the invitation ----
  window.addEventListener("beforeunload", function(e){ if (dirty) { e.preventDefault(); e.returnValue = ""; } });
  fetch("data.json?v=" + Date.now(), {cache: "no-store"}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }).then(function(data){
    if (data) { if (!data.fb) delete data.fb; S = Object.assign({}, DEFAULTS, data); normalize(); }
    if (GCODE && S.guests[GCODE]) GUEST = String(S.guests[GCODE]).slice(0, 80);
    render();
    var G = gh(), remembered = false; try { remembered = localStorage.getItem("owner") === "1"; } catch(e){}
    if (remembered && G.repo && G.token) {
      // re-check quietly so a revoked token stops working
      verify(G).then(function(){ OWNER = true; if (location.hash === "#edit") { history.replaceState(null, "", location.pathname + location.search); showBar(); } })
        .catch(function(e){ if (e && (e.status === 401 || e.status === 403 || e.status === 404)) { try { localStorage.removeItem("owner"); } catch(err){} } });
    }
    if (location.hash === "#edit") setTimeout(openLogin, remembered ? 1200 : 0);
  });
})();
</script>
