<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ធៀបការ</title>
<meta name="description" content="សូមគោរពអញ្ជើញចូលរួមពិធីអាពាហ៍ពិពាហ៍">
<meta property="og:title" content="សិរីមង្គលអាពាហ៍ពិពាហ៍">
<meta property="og:description" content="សូមគោរពអញ្ជើញចូលរួមពិធីអាពាហ៍ពិពាហ៍">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Moul&family=Battambang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: a phone-shaped silk "film" stage that plays the invitation page by page; a stacked list view for reading and editing. Deliberate single theme (crimson silk + gold). */
:root{
  color-scheme: dark;
  --silk:#5c0c1c;
  --silk-deep:#3f0612;
  --gold:#d9b25f;
  --gold-soft:#f0d79a;
  --ivory:#fbf3e2;
  --ink-soft:#e9d3bf;
  --edit:#7ec8b8;
  --f-display:"Moul", "Khmer OS Muol Light", serif;
  --f-body:"Battambang", "Khmer OS", system-ui, sans-serif;
  --f-latin:"Cormorant Garamond", Georgia, serif;
  --shade:63,6,18;
  --glow:#7a1427;
  --on-gold:#3f0612;
}
/* owner-selectable themes */
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--silk-deep);
  background-image:radial-gradient(ellipse at 50% 0%, var(--glow) 0%, transparent 60%),repeating-linear-gradient(45deg, rgba(217,178,95,.04) 0 2px, transparent 2px 14px);
  color:var(--ivory); font-family:var(--f-body); line-height:1.9;
  padding-block:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body.has-bar{padding-bottom:96px}
h1,h2,h3,.moul{font-family:var(--f-display); font-weight:400; color:var(--gold-soft); text-wrap:balance; margin:0}
h2{font-size:20px}
button{font-family:inherit}

/* shared page look */
.page{position:relative; background:var(--silk); border:1px solid var(--gold); border-radius:4px; text-align:center}
.page:not(.photo)::before{content:""; position:absolute; inset:11px; border:1px solid rgba(217,178,95,.55); pointer-events:none; z-index:2}
.page:not(.photo)::after{content:""; position:absolute; inset:16px; border:1px solid rgba(217,178,95,.22); pointer-events:none; z-index:2}
.inner{display:flex; flex-direction:column; gap:22px; padding:64px 34px 60px; margin:auto 0; width:100%}
.corner{position:absolute; width:68px; height:68px; color:var(--gold); pointer-events:none; z-index:3}
.corner.c-tl{top:4px; left:4px}.corner.c-tr{top:4px; right:4px; transform:scaleX(-1)}
.corner.c-bl{bottom:4px; left:4px; transform:scaleY(-1)}.corner.c-br{bottom:4px; right:4px; transform:scale(-1,-1)}
.lotus{width:64px; height:auto; margin:0 auto; color:var(--gold)}
.crest{width:min(220px, 70%); height:auto; margin:0 auto; color:var(--gold); display:block; overflow:visible}
.flipv{transform:scaleY(-1)}
.rule{width:min(260px, 86%); height:auto; color:var(--gold); display:block; margin:0 auto; overflow:visible}
.vh{display:flex; flex-direction:column; align-items:center; gap:4px}
.vh .hd{width:110px; height:auto; color:var(--gold); overflow:visible}
.vh .hd.flip{transform:scaleY(-1)}
.vh h2{letter-spacing:.03em}
.cart{position:relative; margin:4px 14px; padding:10px 18px; border:1px solid var(--gold); outline:1px solid rgba(217,178,95,.45); outline-offset:4px; background:rgba(var(--shade),.25)}
.has-cover .cart{background:rgba(var(--shade),.55)}
.cart .ear{position:absolute; top:50%; left:-31px; width:24px; height:40px; transform:translateY(-50%); color:var(--gold)}
.cart .ear.r{left:auto; right:-31px; transform:translateY(-50%) scaleX(-1)}
.divider{display:flex; align-items:center; justify-content:center; color:var(--gold)}
.eyebrow{font-family:var(--f-display); font-size:15px; color:var(--gold)}
.names{display:flex; flex-direction:column; align-items:center; gap:2px}
.names h1{font-size:clamp(26px, 8vw, 36px); line-height:1.7}
.amp{font-family:var(--f-latin); font-style:italic; font-size:30px; color:var(--gold); line-height:1}
.latin{font-family:var(--f-latin); font-size:20px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase}
.date-big{font-family:var(--f-latin); font-size:22px; color:var(--gold-soft); letter-spacing:.2em; font-variant-numeric:tabular-nums}
.cover-photo{position:absolute; inset:0; overflow:hidden; border-radius:4px}
.cover-photo img{width:100%; height:100%; object-fit:cover; display:block}
.cover-photo::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(var(--shade),.1) 30%, rgba(var(--shade),.92) 78%)}
.has-cover .inner{position:relative; z-index:1; margin-top:auto; padding-top:40vh}
.parents{display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:15px}
.parents>div{min-width:0}
.side{font-family:var(--f-display); font-size:13px; color:var(--gold); display:block; margin-bottom:4px}
.parents p{margin:0}
.invite-text{font-size:16px; color:var(--ink-soft); white-space:pre-line}
.couple{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.couple>div{min-width:0; padding:12px 8px; border-top:1px solid rgba(217,178,95,.4); border-bottom:1px solid rgba(217,178,95,.4)}
.role{font-size:14px; color:var(--gold)}
.couple .moul{font-size:19px; line-height:1.8; display:block}
.when{display:flex; flex-direction:column; gap:4px; font-size:16px}
.when .moul{font-size:18px}
.lunar{font-size:14px; color:var(--ink-soft)}
.countdown{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:340px; margin:0 auto; width:100%}
.countdown div{border:1px solid rgba(217,178,95,.5); padding:8px 4px 4px; border-radius:3px}
.countdown b{display:block; font-family:var(--f-latin); font-size:26px; color:var(--gold-soft); font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.countdown small{font-size:12px; color:var(--ink-soft)}
.session{text-align:left}
.session h3{font-size:16px; color:var(--gold); text-align:center; margin-bottom:6px}
.session ol{list-style:none; margin:0; padding:0}
.session li{display:grid; grid-template-columns:62px 1fr auto; gap:12px; align-items:start; padding:8px 0; border-bottom:1px dashed rgba(217,178,95,.28); font-size:15px}
.session li:last-child{border-bottom:0}
.session time{font-family:var(--f-latin); font-size:18px; color:var(--gold-soft); font-variant-numeric:tabular-nums; font-weight:600}
.session li span{min-width:0}
.gallery{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.gallery figure{margin:0; position:relative; min-width:0}
.gallery figure:first-child{grid-column:1/-1}
.gallery img{width:100%; aspect-ratio:1; max-width:100%; object-fit:cover; display:block; border-radius:3px; cursor:zoom-in; border:1px solid rgba(217,178,95,.35)}
.gallery figure:first-child img{aspect-ratio:4/3}
video{width:100%; max-width:100%; max-height:60vh; border:1px solid var(--gold); border-radius:4px; background:#000}
.venue p,.gift p,.closing p{margin:0; font-size:15px; color:var(--ink-soft); white-space:pre-line}
.qr{width:200px; max-width:100%; background:#fff; padding:10px; border-radius:6px; margin:0 auto; display:block}
.actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.btn{display:inline-flex; align-items:center; gap:8px; font-size:15px; text-decoration:none; padding:10px 18px; border-radius:999px; border:1px solid var(--gold); color:var(--gold-soft); background:transparent; cursor:pointer}
.btn.solid{background:var(--gold); color:var(--on-gold); font-weight:700}
.btn:hover{background:var(--gold-soft); color:var(--silk-deep)}
.btn svg{width:16px; height:16px}
:focus-visible{outline:2px solid var(--gold-soft); outline-offset:3px}

/* photo page */
.page.photo{background:#1c0308; overflow:hidden}
.photo .frame{position:absolute; inset:0; overflow:hidden; border-radius:4px}
.photo .frame img{width:100%; height:100%; object-fit:contain; display:block; transform-origin:center}
.photo .frame .bg{position:absolute; inset:-20px; width:calc(100% + 40px); height:calc(100% + 40px); object-fit:cover; filter:blur(18px) brightness(.5)}
.photo .frame img.fg{position:relative}
.photo .cap{position:absolute; left:0; right:0; bottom:0; z-index:1; padding:40px 16px 18px; background:linear-gradient(transparent, rgba(28,3,8,.85)); font-family:var(--f-latin); font-size:20px; letter-spacing:.14em; color:var(--gold-soft); text-transform:uppercase}

/* player */
.player{position:relative; max-width:480px; margin:0 auto; height:calc(100vh - 32px); height:calc(100dvh - 32px); max-height:900px; min-height:520px; display:flex; flex-direction:column; gap:10px}
body.has-bar .player{height:calc(100vh - 112px); height:calc(100dvh - 112px)}
.progress{display:flex; gap:4px; padding:0 2px}
.progress button{flex:1; height:14px; padding:5px 0; background:none; border:0; cursor:pointer}
.progress i{display:block; height:3px; border-radius:2px; background:rgba(240,215,154,.25); overflow:hidden}
.progress i b{display:block; height:100%; width:0; background:var(--gold-soft)}
.slides{position:relative; flex:1; min-height:0; touch-action:pan-y pinch-zoom}
.slide{position:absolute; inset:0; opacity:0; visibility:hidden; transition:opacity .7s ease, visibility 0s linear .7s, transform .7s ease; transform:scale(1.02)}
.slide.on{opacity:1; visibility:visible; transform:none; transition:opacity .7s ease, visibility 0s, transform .7s ease}
.slide .page{height:100%; overflow:auto; display:flex; flex-direction:column; overscroll-behavior:contain}
.slide .inner{margin:auto 0}
.slide.on .inner>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.slide.on .inner>*:nth-child(2){animation-delay:.15s}.slide.on .inner>*:nth-child(3){animation-delay:.3s}
.slide.on .inner>*:nth-child(4){animation-delay:.45s}.slide.on .inner>*:nth-child(5){animation-delay:.6s}
.slide.on .inner>*:nth-child(6){animation-delay:.75s}.slide.on .inner>*:nth-child(n+7){animation-delay:.9s}
@keyframes rise{from{opacity:0; transform:translateY(14px)}}
.slide.on .kb{animation:kb var(--dur,6s) linear both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
.paused .slide .kb{animation-play-state:paused!important}
.progress,.ctl{display:none!important}
.player{gap:0}
.slides img{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none}
.slides{-webkit-user-select:none; user-select:none}
.flash{position:absolute; inset:0; margin:auto; width:72px; height:72px; border-radius:50%; background:rgba(28,3,8,.55); color:var(--gold-soft); display:grid; place-items:center; z-index:4; pointer-events:none; animation:flash .7s ease forwards}
.flash svg{width:30px; height:30px}
@keyframes flash{from{opacity:1; transform:scale(.85)}to{opacity:0; transform:scale(1.15)}}
.ctl{display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap}
.ic{width:42px; height:42px; border-radius:999px; border:1px solid rgba(217,178,95,.55); background:rgba(63,6,18,.6); color:var(--gold-soft); display:inline-grid; place-items:center; cursor:pointer; padding:0}
.ic:hover{background:var(--gold); color:var(--silk-deep)}
.ic.big{width:50px; height:50px; background:var(--gold); color:var(--silk-deep)}
.ic svg{width:20px; height:20px}
.ic[disabled]{opacity:.35; cursor:default}
.sep{width:1px; height:24px; background:rgba(217,178,95,.35); margin:0 4px}
.count{font-family:var(--f-latin); font-size:16px; color:var(--ink-soft); min-width:48px; text-align:center; font-variant-numeric:tabular-nums}
.zlabel{font-family:var(--f-latin); font-size:15px; color:var(--ink-soft); min-width:44px; text-align:center; font-variant-numeric:tabular-nums}
/* opening screen: full photo, gold title, guest name on a banner, play button */
.start{position:absolute; inset:0; z-index:6; overflow:hidden; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center; cursor:pointer; background:var(--silk); transition:opacity .8s ease, transform .8s ease}
.start.out{opacity:0; transform:scale(1.04); pointer-events:none}
.start .bgimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.start::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(var(--shade),.55) 0%, rgba(var(--shade),0) 30%, rgba(var(--shade),0) 52%, rgba(var(--shade),.82) 82%, rgba(var(--shade),.92) 100%); pointer-events:none}
.start > *:not(.bgimg){position:relative; z-index:2}
.start .corner{position:absolute; z-index:3; width:82px; height:82px}
.st-top{padding:9% 20px 0; display:flex; flex-direction:column; align-items:center; gap:2px}
.st-title{font-family:var(--f-display); font-size:clamp(30px, 10vw, 44px); line-height:1.55; white-space:pre-line; margin:0;
  background:linear-gradient(180deg, #fff6d8 0%, #f0d79a 35%, #c9993f 62%, #f7e3a8 80%, #b88a35 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(240,215,154,.35))}
.st-top .crest{width:180px; color:var(--gold-soft); filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.st-bot{width:100%; padding:0 18px 7%; display:flex; flex-direction:column; align-items:center; gap:12px}
.st-invite{font-family:var(--f-display); font-size:clamp(20px, 6.4vw, 27px); line-height:1.6; color:var(--gold-soft); text-shadow:0 2px 4px rgba(0,0,0,.6)}
.banner{position:relative; width:min(100%, 330px); margin:0 34px; padding:8px 16px; background:linear-gradient(180deg, #fffdf6, #f3e6c4); border:2px solid #d9b25f; outline:1px solid #d9b25f; outline-offset:3px; border-radius:3px; box-shadow:0 8px 24px -10px rgba(0,0,0,.7)}
.banner b{display:block; font-family:var(--f-display); font-weight:400; font-size:clamp(16px, 5vw, 21px); line-height:1.7; color:#5c0c1c; overflow-wrap:anywhere}
.banner .ear{position:absolute; top:50%; left:-33px; width:26px; height:44px; transform:translateY(-50%); color:#e3c06d}
.banner .ear.r{left:auto; right:-33px; transform:translateY(-50%) scaleX(-1)}
.st-play{width:58px; height:58px; border-radius:50%; border:2px solid #d9b25f; background:#fffaf0; color:#5c0c1c; display:grid; place-items:center; cursor:pointer; padding:0; box-shadow:0 0 0 5px rgba(240,215,154,.25), 0 8px 20px -6px rgba(0,0,0,.7)}
.st-play svg{width:24px; height:24px; margin-left:3px}
.st-hint{font-size:13px; color:var(--ink-soft); text-shadow:0 1px 3px rgba(0,0,0,.7)}
@media (prefers-reduced-motion:no-preference){
  .st-play{animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 11px rgba(240,215,154,.12), 0 8px 20px -6px rgba(0,0,0,.7)}}
  .start .bgimg{animation:kb 14s ease-out both}
  .st-top,.st-bot{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}.st-bot{animation-delay:.35s}
}

/* timeline programme */
.tl{position:relative; display:grid; grid-template-columns:1fr 1fr; margin-top:6px}
.tl .vine{position:absolute; left:50%; top:0; width:24px; height:100%; transform:translateX(-50%); color:var(--gold)}
.tl-item{display:flex; flex-direction:column; align-items:center; gap:0; padding:2px 16px 12px; font-size:14px; line-height:1.6; min-width:0; text-align:center}
.tl-item.l{grid-column:1}.tl-item.r{grid-column:2}
.tl-item svg{width:34px; height:34px; color:var(--gold); margin-bottom:2px}
.tl-item time{font-family:var(--f-latin); font-size:17px; color:var(--gold-soft); font-weight:600; font-variant-numeric:tabular-nums}
.tl-item span{min-width:0}
.script{font-family:var(--f-latin); font-style:italic; font-size:28px; color:var(--gold-soft); line-height:1.2}
.collage{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.collage img{width:100%; max-width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:3px; display:block; border:1px solid rgba(217,178,95,.35)}
.collage img:first-child{grid-column:1/-1; aspect-ratio:4/3}
.has-cover .countdown div{background:rgba(var(--shade),.5)}
/* quick buttons under the film */
.player:not(.go) .qnav{visibility:hidden}
.qnav{display:flex; gap:8px; justify-content:center; padding-top:10px}
.qnav button{flex:1; max-width:92px; height:50px; border-radius:12px; border:1px solid rgba(217,178,95,.5); background:rgba(var(--shade),.7); color:var(--gold-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; cursor:pointer; font-size:11px; line-height:1.3}
.qnav button svg{width:19px; height:19px}
.qnav button.on{background:var(--gold); color:var(--on-gold)}
.sparks{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3}
.backdrop{position:fixed; inset:-40px; z-index:-1; background-size:cover; background-position:center; filter:blur(22px) brightness(.45)}
/* list view */
.list{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
.list .page{display:flex; flex-direction:column}
.list .page.photo{display:none}
.list .page.has-cover{min-height:560px}
.list .page.has-cover .inner{padding-top:300px}
.backbar{display:flex; justify-content:center}

/* owner editing */
.editing [data-k]{outline:1px dashed var(--edit); outline-offset:3px; border-radius:2px; cursor:text}
.editing [data-k]:focus{outline-style:solid; background:rgba(126,200,184,.08)}
.tool{font:13px var(--f-body); color:var(--edit); background:transparent; border:1px dashed var(--edit); border-radius:999px; padding:4px 12px; cursor:pointer; align-self:center}
.tool.x{border:0; padding:0 6px; font-size:18px; line-height:1}
.tool.over{position:absolute; top:6px; right:6px; background:rgba(0,0,0,.6); border:0; color:#fff; padding:2px 9px; z-index:3}
.settings{text-align:left}
.settings h2{color:var(--edit); font-size:16px}
.settings label{display:flex; flex-direction:column; gap:4px; color:var(--ink-soft); font-size:14px}
.settings input,.settings select,.settings textarea{font:15px var(--f-body); padding:8px 10px; border-radius:4px; border:1px solid rgba(126,200,184,.6); background:var(--silk-deep); color:var(--ivory); width:100%}
.settings .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:14px; color:var(--ink-soft)}
.bar{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
  padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background:rgba(40,4,12,.94); border-top:1px solid rgba(217,178,95,.4)}
.bar .btn{padding:8px 16px}
.bar .btn[disabled]{opacity:.45; cursor:default}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom, 0px)); background:var(--ivory); color:var(--silk-deep); padding:8px 16px; border-radius:999px; font-size:14px; z-index:30; max-width:90vw}
.lightbox{position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; padding:16px; cursor:zoom-out}
.lightbox img{max-height:100%; object-fit:contain}
@media (max-width:420px){.inner{padding:60px 26px 56px}.cart{margin:4px 22px; padding:8px 12px}.parents,.couple{grid-template-columns:1fr}.ic{width:38px; height:38px}.ic.big{width:46px; height:46px}}
@media (prefers-reduced-motion:reduce){.slide,.slide.on{transition:none}.slide.on .inner>*,.slide.on .kb{animation:none}}

.guest{display:flex; flex-direction:column; gap:0; margin-top:6px; padding:10px 14px; border:1px solid rgba(217,178,95,.5); border-radius:999px; background:rgba(var(--shade),.45)}
.guest span{font-size:13px; color:var(--ink-soft)}
.guest b{font-family:var(--f-display); font-weight:400; font-size:17px; color:var(--gold-soft)}
.wish-form{display:flex; flex-direction:column; gap:10px; text-align:left}
.wish-form input,.wish-form textarea{font:15px var(--f-body); padding:10px 12px; border-radius:8px; border:1px solid rgba(217,178,95,.55); background:rgba(var(--shade),.5); color:var(--ivory); width:100%; resize:vertical}
.wish-form input::placeholder,.wish-form textarea::placeholder{color:var(--ink-soft); opacity:.7}
.wish-form .btn{align-self:center}
.wish-form p{margin:0; text-align:center}
.hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.wishes{display:flex; flex-direction:column; gap:10px; text-align:left; max-height:38vh; overflow:auto; padding-right:4px}
.wish{padding:10px 12px; border-left:2px solid var(--gold); background:rgba(var(--shade),.35); border-radius:0 6px 6px 0}
.wish b{font-size:14px; color:var(--gold-soft)}
.wish p{margin:2px 0 0; font-size:14px; color:var(--ink-soft); white-space:pre-line; overflow-wrap:anywhere}
.links{display:flex; flex-direction:column; gap:10px}
.link-row{display:flex; flex-direction:column; gap:4px; padding:10px; border:1px dashed var(--edit); border-radius:6px; min-width:0}
.link-row code{font-size:12px; color:var(--ink-soft); overflow-wrap:anywhere}
.link-row .actions{justify-content:flex-start}
a.tool{text-decoration:none; display:inline-flex; align-items:center; gap:4px}
.tool svg{width:14px; height:14px}
.share{display:flex; flex-wrap:wrap; gap:6px}
.sh{display:inline-flex; align-items:center; gap:4px; font:13px var(--f-body); padding:6px 12px; border-radius:999px; border:0; cursor:pointer; color:#fff; text-decoration:none}
.sh svg{width:14px; height:14px}
.sh.tg{background:#229ED9}
.sh.ms{background:linear-gradient(135deg,#00B2FF,#006AFF 55%,#A033FF)}
.sh.ig{background:linear-gradient(45deg,#F58529,#DD2A7B 50%,#8134AF)}
.sh.cp{background:transparent; color:var(--edit); border:1px dashed var(--edit)}
.ask{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px}
.ask-card{background:var(--silk); border:1px solid var(--gold); border-radius:12px; padding:22px 20px; max-width:360px; width:100%; text-align:center; display:flex; flex-direction:column; gap:12px}
.ask-card h3{font-family:var(--f-body); font-size:17px; color:var(--ivory); line-height:1.9}
.ask-card h3 .moul{font-size:20px; color:var(--gold-soft)}
.ask-card p{margin:0}
.ask-msg{font-size:13px; color:var(--ink-soft); background:rgba(var(--shade),.5); border-radius:8px; padding:10px; text-align:left; overflow-wrap:anywhere}
.link-row.sent{border-style:solid; border-color:rgba(126,200,184,.5)}
.link-row .ok{font-family:var(--f-body); font-size:12px; color:var(--edit); font-weight:400}
.inbox{display:flex; flex-direction:column; gap:10px}
.inbox .wish time{display:block; font-size:12px; color:var(--ink-soft); opacity:.75; margin-top:2px}
.wish-h{display:flex; align-items:baseline; gap:6px}
.wish-h small{font-size:12px; color:var(--ink-soft)}
.wish-h .tool{margin-left:auto}
.list .page.settings .inner{text-align:left}
.qrbox{width:min(100%, 260px); margin:0 auto; padding:10px; border:1px solid var(--gold); border-radius:16px; background:rgba(var(--shade),.4)}
.qrbox canvas{width:100%; height:auto; display:block; aspect-ratio:1}
.names.small{flex-direction:row; justify-content:center; gap:10px; flex-wrap:wrap; align-items:baseline}
.names.small .moul{font-size:17px}
.names.small .amp{font-size:22px}
.themes-wrap{display:flex; flex-direction:column; gap:6px; color:var(--ink-soft); font-size:14px}
.themes{display:grid; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:8px}
.sw{display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px; border:1px solid transparent; border-radius:10px; background:none; cursor:pointer; color:var(--ink-soft); font:12px var(--f-body); line-height:1.4; position:relative}
.sw i{display:block; width:40px; height:40px; border-radius:50%; position:relative; overflow:hidden}
.sw.on{border-color:var(--edit); background:rgba(126,200,184,.12)}
.sw.on i::after{content:"✓"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-style:normal; font-size:18px; text-shadow:0 1px 3px #000}
.sw input[type=color]{position:absolute; inset:-8px; width:60px; height:60px; opacity:0; cursor:pointer; border:0; padding:0}
.loading{display:grid; place-items:center; height:70vh; color:var(--gold)}

    var c0 = n / 2, hole = im ? n * .13 : 0;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      if (!qr.isDark(r, c)) continue;
      if (hole && Math.hypot(r + .5 - c0, c + .5 - c0) < hole + .6) continue;
      ctx.fillRect(x + (c + quiet) * cell, y + (r + quiet) * cell, Math.ceil(cell), Math.ceil(cell));
    }
    if (im) {
      var cx = x + size / 2, cy = y + size / 2, rad = hole * cell;
      ctx.beginPath(); ctx.arc(cx, cy, rad + cell * .5, 0, 6.283); ctx.fillStyle = "#d9b25f"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, rad - cell * .2, 0, 6.283); ctx.clip();
      coverFit(ctx, im, cx - rad, cy - rad, rad * 2, rad * 2);
    }
    ctx.restore();
  }
  function drawQRs(){
    var cs = app.querySelectorAll("canvas[data-qr]"); if (!cs.length) return;
    Promise.all([qrLib(), loadImg(couplePhoto())]).then(function(r){
      cs.forEach(function(cv){ var ctx = cv.getContext("2d"); ctx.clearRect(0, 0, cv.width, cv.height); paintQR(ctx, r[0], r[1], 0, 0, cv.width); });
    }).catch(function(){ cs.forEach(function(cv){ var p = document.createElement("p"); p.className = "lunar"; p.textContent = baseUrl(); cv.replaceWith(p); }); });
  }
  // a shareable card: photo on top, names, date, QR
  function saveQrCard(b){
    var o = b.innerHTML; b.disabled = true; b.textContent = "កំពុងរៀបចំ…";
    var gold = getComputedStyle(document.body).getPropertyValue("--gold").trim() || "#d9b25f";
    Promise.all([qrLib(), loadImg(couplePhoto()), document.fonts ? document.fonts.ready : null, svgImg(CORNERS.split("</svg>")[0] + "</svg>", gold), svgImg(RULE, gold)]).then(function(r){
      var W = 1080, H = 1500, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      var ctx = cv.getContext("2d"), cs = getComputedStyle(document.body);
      var v = function(n){ return cs.getPropertyValue(n).trim(); };
      ctx.fillStyle = v("--silk") || "#5c0c1c"; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = v("--gold") || "#d9b25f"; ctx.lineWidth = 3; ctx.strokeRect(24, 24, W - 48, H - 48);
      ctx.lineWidth = 1.5; ctx.globalAlpha = .5; ctx.strokeRect(36, 36, W - 72, H - 72); ctx.globalAlpha = 1;
      var ornC = r[3]; if (ornC) { [[0,0,1,1],[W,0,-1,1],[0,H,1,-1],[W,H,-1,-1]].forEach(function(q){ ctx.save(); ctx.translate(q[0], q[1]); ctx.scale(q[2], q[3]); ctx.drawImage(ornC, 14, 14, 150, 150); ctx.restore(); }); }
      var top = 60;
      if (r[1]) {
        ctx.save(); var aw = 640, ah = 560, ax = (W - aw) / 2;
        ctx.beginPath(); ctx.moveTo(ax, top + ah); ctx.lineTo(ax, top + aw / 2); ctx.arc(W / 2, top + aw / 2, aw / 2, Math.PI, 0); ctx.lineTo(ax + aw, top + ah); ctx.closePath();
        ctx.clip(); coverFit(ctx, r[1], ax, top, aw, ah); ctx.restore();
        ctx.beginPath(); ctx.moveTo(ax, top + ah); ctx.lineTo(ax, top + aw / 2); ctx.arc(W / 2, top + aw / 2, aw / 2, Math.PI, 0); ctx.lineTo(ax + aw, top + ah); ctx.stroke();
        top += ah + 40;
      } else top += 80;
      ctx.textAlign = "center"; ctx.fillStyle = v("--gold") || "#d9b25f";
      ctx.font = "34px Moul, serif"; ctx.fillText(S.eyebrow, W / 2, top + 30);
      ctx.fillStyle = v("--gold-soft") || "#f0d79a"; ctx.font = "54px Moul, serif";
      ctx.fillText(S.groom + "  &  " + S.bride, W / 2, top + 120, W - 120);
      if (r[4]) ctx.drawImage(r[4], W / 2 - 260, top + 140, 520, 43);
      ctx.font = "italic 40px 'Cormorant Garamond', serif"; ctx.fillText(S.dateShort, W / 2, top + 230);
      var qs = r[1] ? 400 : 600, qy = H - qs - 130;
      paintQR(ctx, r[0], r[1], (W - qs) / 2, qy, qs);
      ctx.fillStyle = v("--ink-soft") || "#e9d3bf"; ctx.font = "30px Battambang, sans-serif"; ctx.fillText("ស្កេនដើម្បីបើកធៀប", W / 2, H - 70);
      return new Promise(function(res){ cv.toBlob(res, "image/png"); });
    }).then(function(blob){
      var name = "QR-" + (S.latin || "wedding").replace(/[^\w&-]+/g, "-") + ".png", file = null;
      try { file = new File([blob], name, {type: "image/png"}); } catch(e){}
      if (file && navigator.canShare && navigator.canShare({files: [file]}) && MOBILE) return navigator.share({files: [file], title: document.title}).catch(function(){});
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    }).catch(function(){ toast("រក្សាទុក QR មិនបាន"); })
      .then(function(){ b.disabled = false; b.innerHTML = o; });
  }
  function loadScript(u){ return new Promise(function(res, rej){ var el = document.createElement("script"); el.src = u; el.onload = res; el.onerror = rej; document.head.appendChild(el); }); }
  function fb(){
    if (!fbOk()) return Promise.reject({code: "no_config"});
    if (!fbReady) {
      var base = "https://www.gstatic.com/firebasejs/" + FBV + "/";
      fbReady = (window.firebase ? Promise.resolve() : loadScript(base + "firebase-app-compat.js").then(function(){ return Promise.all([loadScript(base + "firebase-firestore-compat.js"), loadScript(base + "firebase-auth-compat.js")]); }))
        .then(function(){ if (!firebase.apps.length) firebase.initializeApp(S.fb); return firebase; });
      fbReady.catch(function(){ fbReady = null; });
    }
    return fbReady;
  }
  app.addEventListener("focusin", function(e){ if (e.target.closest(".wish-form")) { if (playing) setPlaying(false); fb().catch(function(){}); } });
  app.addEventListener("submit", function(e){
    var f = e.target.closest("[data-wish]"); if (!f) return;
    e.preventDefault();
    var name = f.elements.name.value.trim().slice(0, 60), msg = f.elements.msg.value.trim().slice(0, 500), out = f.querySelector("[data-wish-msg]"), btn = f.querySelector("button");
    if (!name || !msg) { out.textContent = "សូមបំពេញឈ្មោះ និងពាក្យជូនពរ"; return; }
    var sent = 0; try { sent = +localStorage.getItem("wsent") || 0; } catch(err){}
    if (sent >= 5) { out.textContent = "អ្នកបានផ្ញើពាក្យជូនពរច្រើនដងហើយ សូមអរគុណ!"; return; }
    if (f.elements.hp.value) { out.textContent = "សូមអរគុណសម្រាប់ពាក្យជូនពរ!"; return; }
    btn.disabled = true; out.textContent = "កំពុងផ្ញើ…";
    fb().then(function(F){ return F.firestore().collection("wishes").add({name: name, msg: msg, to: GUEST.slice(0, 80), at: F.firestore.FieldValue.serverTimestamp()}); })
      .then(function(){ f.elements.msg.value = ""; out.textContent = "សូមអរគុណសម្រាប់ពាក្យជូនពរ! ពាក្យរបស់អ្នកបានទៅដល់កូនកំលោះ កូនក្រមុំហើយ"; try { localStorage.setItem("wsent", sent + 1); } catch(err){} })
      .catch(function(){ out.textContent = "ផ្ញើមិនបាន សូមពិនិត្យអ៊ីនធឺណិត ហើយព្យាយាមម្តងទៀត"; })
      .then(function(){ btn.disabled = false; });
  });
  function stopInbox(){ if (unsubSnap) { unsubSnap(); unsubSnap = null; } if (unsubAuth) { unsubAuth(); unsubAuth = null; } }
  function initInbox(){
    stopInbox();
    var st = document.getElementById("inbox-st");
    fb().then(function(F){
      unsubAuth = F.auth().onAuthStateChanged(function(u){
        if (unsubSnap) { unsubSnap(); unsubSnap = null; }
        var tools = document.getElementById("inbox-tools"); if (!st.isConnected) return;
        if (!u) { st.innerHTML = '<button class="btn solid" data-ui="signin">ចូលដោយគណនី Google របស់បង</button>'; tools.hidden = true; document.getElementById("inbox").textContent = ""; return; }
        st.innerHTML = '<span>ចូលជា ' + esc(u.email || "") + '</span><button class="tool" data-ui="signout">ចាកចេញ</button>';
        document.getElementById("inbox").innerHTML = '<p class="lunar">កំពុងផ្ទុក…</p>';
        unsubSnap = F.firestore().collection("wishes").orderBy("at", "desc").limit(1000).onSnapshot(function(snap){
          INBOX = snap.docs.map(function(d){ var x = d.data(); return {id: d.id, name: x.name || "", msg: x.msg || "", to: x.to || "", at: x.at && x.at.toDate ? x.at.toDate() : null}; });
          tools.hidden = false; fillInbox();
        }, function(err){
          document.getElementById("inbox").innerHTML = '<p class="lunar">' + (err && err.code === "permission-denied" ? "គណនីនេះមិនមែនជាម្ចាស់ទេ — សូមចូលដោយអ៊ីមែលដែលដាក់ក្នុង Firestore rules" : "មិនអាចផ្ទុកបានទេ") + "</p>";
        });
      });
    }).catch(function(e){ st.textContent = e && e.code === "no_config" ? "សូមដាក់ Firebase config ក្នុងការកំណត់ជាមុនសិន (មើល README)" : "មិនអាចភ្ជាប់ Firebase បានទេ"; });
  }
  function signIn(){
    fb().then(function(F){
      var pv = new F.auth.GoogleAuthProvider();
      return F.auth().signInWithPopup(pv).catch(function(e){ if (e && /popup|operation-not-supported/.test(e.code || "")) return F.auth().signInWithRedirect(pv); throw e; });
    }).catch(function(e){ toast("ចូលមិនបាន៖ " + ((e && e.code) || "")); });
  }
  function fillInbox(){
    var box = document.getElementById("inbox"); if (!box) return;
    document.getElementById("inbox-count").textContent = "សរុប " + kn((INBOX || []).length) + " ពាក្យជូនពរ";
    box.textContent = "";

      var h = document.createElement("div"); h.className = "wish-h";

      var del = document.createElement("button"); del.className = "tool x"; del.dataset.ui = "del-wish"; del.dataset.id = w.id; del.setAttribute("aria-label", "លុប"); del.textContent = "×"; h.appendChild(del);
      var msg = document.createElement("p"); msg.textContent = w.msg;

  function delWish(b){
    if (b.dataset.armed) { fb().then(function(F){ return F.firestore().collection("wishes").doc(b.dataset.id).delete(); }).catch(function(){ toast("លុបមិនបាន"); }); return; }
    b.dataset.armed = "1"; b.textContent = "លុប?"; setTimeout(function(){ if (b.isConnected) { delete b.dataset.armed; b.textContent = "×"; } }, 3000);
  }

  // ---- owner bar ----
  function markDirty(){ dirty = true; updateBar(); }
  function updateBar(){
    var bar = document.getElementById("bar"); if (!bar) return;
    bar.innerHTML = editing
      ? '<button class="btn solid" id="b-save"' + (dirty && !busy ? "" : " disabled") + ">" + (busy ? "កំពុងបញ្ចូល…" : "រក្សាទុក") + '</button><button class="btn" id="b-cancel">' + (dirty ? "បោះបង់" : "បិទការកែ") + "</button>"
      : '<button class="btn solid" id="b-edit">កែប្រែធៀប</button>' + (fbOk() ? '<button class="btn" id="b-inbox">' + I.chat + " ពាក្យជូនពរ</button>" : "") + '<button class="btn" id="b-hide" title="លាក់ប៊ូតុង (ចុច ៥ ដងលើកាលបរិច្ឆេទដើម្បីបង្ហាញវិញ)">លាក់</button><button class="btn" id="b-logout">ចាកចេញ</button>';
  }
  document.body.addEventListener("click", function(e){
    var btn = e.target.closest("button"), id = btn && btn.id;
    if (id === "b-edit") { stopInbox(); setPlaying(false); editing = true; mode = "list"; render(); updateBar(); window.scrollTo(0, 0); }
    else if (id === "b-inbox") { setPlaying(false); mode = "inbox"; render(); window.scrollTo(0, 0); }
    else if (id === "b-cancel") { if (dirty) location.reload(); else { editing = false; mode = "play"; render(); updateBar(); } }
    else if (id === "b-save" && dirty && !busy) save(btn);
    else if (id === "b-hide") hideBar();
    else if (id === "b-logout") { try { localStorage.removeItem("gh"); localStorage.removeItem("owner"); } catch(err){} OWNER = false; hideBar(); toast("បានចាកចេញពីឧបករណ៍នេះ"); }
    else if (id === "login-go") login();
    else if (id === "login-x") closeLogin();
  });

  // ---- owner sign-in: only someone whose GitHub token can write to this repo becomes the owner ----
  function showBar(){
    if (document.getElementById("bar")) return;
    var bar = document.createElement("div"); bar.id = "bar"; bar.className = "bar"; document.body.appendChild(bar);
    document.body.classList.add("has-bar"); updateBar();
  }
  function hideBar(){
    if (editing && dirty) { toast("សូមរក្សាទុក ឬបោះបង់ការកែជាមុនសិន"); return; }
    var bar = document.getElementById("bar"); if (bar) bar.remove();
    document.body.classList.remove("has-bar");
    if (editing || mode === "inbox") { stopInbox(); editing = false; mode = "play"; render(); }
  }
  function verify(cfg){
    return fetch("https://api.github.com/repos/" + cfg.repo, {cache: "no-store", headers: {"Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json"}})
      .then(function(r){ if (!r.ok) throw {status: r.status}; return r.json(); })
      .then(function(j){ if (!(j.permissions && j.permissions.push)) throw {status: 403}; return true; });
  }
  function openLogin(){
    if (OWNER) { showBar(); return; }
    if (document.getElementById("login")) return;
    var G = gh(), box = document.createElement("div"); box.id = "login"; box.className = "ask"; box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true");
    box.innerHTML = '<form class="ask-card settings" onsubmit="return false"><h3>ចូលសម្រាប់ម្ចាស់ធៀប</h3><p class="lunar">ប្រើ GitHub token ដែលមានសិទ្ធិសរសេរលើ repo នេះ។ ភ្ញៀវមិនអាចចូលបានទេ។</p>' +
      '<label for="lg-repo">Repo<input id="lg-repo" value="' + esc(G.repo || guessRepo()) + '" placeholder="username/repo" autocomplete="off"></label>' +
      '<label for="lg-token">Token<input id="lg-token" type="password" value="" autocomplete="off" placeholder="github_pat_…"></label>' +
      '<p class="lunar" style="margin:0">មិនទាន់មាន Token? <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--gold-soft)">ចុចទីនេះដើម្បីបង្កើត</a> → Only select repositories → ' + esc(guessRepo().split("/")[1] || "wedding") + ' → Contents: Read and write</p>' +
      '<p class="lunar" id="lg-msg" role="status"></p><div class="actions"><button class="btn solid" id="login-go" type="submit">ចូល</button><button class="btn" id="login-x" type="button">បិទ</button></div></form>';
    document.body.appendChild(box);
    setPlaying(false);
    document.getElementById(G.repo || guessRepo() ? "lg-token" : "lg-repo").focus();
    box.addEventListener("click", function(e){ if (e.target === box) closeLogin(); });
  }
  function closeLogin(){ var b = document.getElementById("login"); if (b) b.remove(); if (location.hash === "#edit") history.replaceState(null, "", location.pathname + location.search); }
  function login(){
    var repo = document.getElementById("lg-repo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$|\/$/g, ""), token = document.getElementById("lg-token").value.trim(), msg = document.getElementById("lg-msg"), btn = document.getElementById("login-go");
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) { msg.textContent = "សូមបំពេញ Repo (username/repo) និង Token"; return; }
    btn.disabled = true; msg.textContent = "កំពុងពិនិត្យ…";
    var cfg = Object.assign(gh(), {repo: repo, token: token, branch: gh().branch || "main"});
    verify(cfg).then(function(){
      try { localStorage.setItem("gh", JSON.stringify(cfg)); localStorage.setItem("owner", "1"); } catch(err){}
      OWNER = true; closeLogin(); showBar(); toast("ស្វាគមន៍ម្ចាស់ធៀប!");
    }).catch(function(e){
      var st = e && e.status;
      msg.textContent = st === 401 ? "Token មិនត្រឹមត្រូវ ឬផុតកំណត់" : (st === 403 || st === 404) ? "Token នេះគ្មានសិទ្ធិសរសេរលើ repo នេះទេ" : "ពិនិត្យមិនបាន សូមពិនិត្យអ៊ីនធឺណិត";
      btn.disabled = false;
    });
  }
  // secret door for the owner: tap the date on the cover 5 times quickly (or open the link with #edit)
  var taps = 0, tapTimer = null;
  app.addEventListener("click", function(e){
    if (!e.target.closest(".date-big,.lotus") || editing) return;
    taps++; clearTimeout(tapTimer); tapTimer = setTimeout(function(){ taps = 0; }, 1500);
    if (taps >= 5) { taps = 0; openLogin(); }
  }, true);
  window.addEventListener("hashchange", function(){ if (location.hash === "#edit") openLogin(); });

  // ---- start: load data.json (the owner's saved content), then show the invitation ----
  window.addEventListener("beforeunload", function(e){ if (dirty) { e.preventDefault(); e.returnValue = ""; } });
  fetch("data.json?v=" + Date.now(), {cache: "no-store"}).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }).then(function(data){
    if (data) { if (!data.fb) delete data.fb; S = Object.assign({}, DEFAULTS, data); normalize(); }
    if (GCODE && S.guests[GCODE]) GUEST = String(S.guests[GCODE]).slice(0, 80);
    render();
    var G = gh(), remembered = false; try { remembered = localStorage.getItem("owner") === "1"; } catch(e){}
    if (remembered && G.repo && G.token) {
      // re-check quietly so a revoked token stops working
      verify(G).then(function(){ OWNER = true; if (location.hash === "#edit") { history.replaceState(null, "", location.pathname + location.search); showBar(); } })
        .catch(function(e){ if (e && (e.status === 401 || e.status === 403 || e.status === 404)) { try { localStorage.removeItem("owner"); } catch(err){} } });
    }
    if (location.hash === "#edit") setTimeout(openLogin, remembered ? 1200 : 0);
  });
})();
